<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Pro Lawn &amp; Pest Control — Welcome Home</title>
<style>
:root{--navy:#1c2e5c;--lime:#8dc641;--green:#099146;--bg:#f4f6f9;--muted:#5a6577}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:#1a1a1a;line-height:1.45}
.wrap{max-width:440px;margin:0 auto;padding:24px 18px 40px}.card{background:#fff;border-radius:14px;box-shadow:0 4px 24px #1c2e5c1a;overflow:hidden}
.banner{background:var(--navy);color:#fff;padding:22px 20px 18px;text-align:center}
.brand{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--lime);font-weight:700;margin-bottom:10px}
.banner h1{margin:0;font-size:1.35rem;line-height:1.25}.price{color:var(--lime);font-size:1.55rem;font-weight:800;margin-top:8px}
.fine{font-size:12px;color:#ffffffbf;margin-top:4px}.sub{margin-top:12px;font-size:13px;color:#ffffffd9}.sub a{color:#fff;font-weight:700}
.body{padding:20px 18px 22px}label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin:14px 0 6px}.req{color:var(--green)}
input,select,textarea{width:100%;padding:12px;border:1.5px solid #d0d7e2;border-radius:8px;font-size:16px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--green)}textarea{min-height:72px}
.btn{display:block;width:100%;margin-top:20px;padding:14px;background:var(--green);color:#fff;border:0;border-radius:10px;font-size:17px;font-weight:700}
.notfound{display:none;background:#fdecea;color:#8a1f11;padding:10px;border-radius:8px;font-size:14px;margin-bottom:8px}
.footer{text-align:center;margin-top:18px;font-size:12px;color:var(--muted)}.footer a{color:var(--navy)}
</style></head><body><div class="wrap"><div class="card">
<div class="banner"><div class="brand">Pro Lawn &amp; Pest Control</div>
<h1>Welcome home — first lawn treatment</h1><div class="price">$29.99</div><div class="fine">*New customers only</div>
<div class="sub">Call <a href="tel:+19184567767">(918) 456-7767</a> · Tulsa area</div></div>
<div class="body">
<div class="notfound" id="nf">We couldn't find this offer link. Please call <a href="tel:+19184567767">(918) 456-7767</a> and we'll take care of you.</div>
<form method="POST" id="f" action="https://murcdxaufedbbaimqbph.supabase.co/functions/v1/mailer-new-homeowner/form" accept-charset="utf-8">
<input type="hidden" name="qr_code" id="qr_code" value=""/>
<label for="full_name">Full name <span class="req">*</span></label><input id="full_name" name="full_name" required autocomplete="name"/>
<label for="phone">Phone <span class="req">*</span></label><input id="phone" name="phone" type="tel" required autocomplete="tel" inputmode="tel" placeholder="(918) 555-0100"/>
<label for="address">Service address <span class="req">*</span></label><input id="address" name="address" required autocomplete="street-address"/>
<label for="best_time">Best time to call</label><select id="best_time" name="best_time"><option>Morning</option><option>Afternoon</option><option>Evening</option><option selected>Anytime</option></select>
<label for="notes">Notes <span style="font-weight:400;color:var(--muted)">(optional)</span></label><textarea id="notes" name="notes" placeholder="Gate code, preferred day, etc."></textarea>
<button class="btn" type="submit">Claim my $29.99 treatment</button></form></div></div>
<p class="footer">Pro Lawn &amp; Pest Control · Tulsa area<br/><a href="https://prolawnpest.com">prolawnpest.com</a></p></div>
<script>
(function(){
  var API = 'https://murcdxaufedbbaimqbph.supabase.co/functions/v1/mailer-new-homeowner';
  var code = (new URLSearchParams(location.search).get('c') || '').slice(0,64);
  document.getElementById('qr_code').value = code;
  if(!code){ document.getElementById('nf').style.display='block'; return; }
  fetch(API + '/r/' + encodeURIComponent(code) + '?format=json').then(function(r){return r.json();}).then(function(d){
    if(!d || !d.ok){ document.getElementById('nf').style.display='block'; return; }
    if(d.full_name) document.getElementById('full_name').value = d.full_name;
    if(d.phone) document.getElementById('phone').value = d.phone;
    if(d.address) document.getElementById('address').value = d.address;
  }).catch(function(){ /* form still works; fields just aren't prefilled */ });
})();
</script></body></html>
